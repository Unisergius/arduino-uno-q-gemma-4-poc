name: Garden Steward
icon: 🌱
description: "Paper Garden demo: Gemma 4 decides when to water, the MCU enforces the safety limits. Fully offline."

bricks:
  - arduino:web_ui
# No arduino:llm brick: on the UNO Q App Lab only offers Gemma 3 1B / Qwen there, and its container
# and root disk are too small for Gemma 4. Gemma 4 runs as our own server instead
# (bash spike/serve_gemma.sh on the board), and the app finds it by itself.
